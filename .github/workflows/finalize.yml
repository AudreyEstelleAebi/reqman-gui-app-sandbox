name: Finalize requirements

# Brings a PR into the mergeable state: merges the base branch, issues one
# revision per changed requirement (tools.reqcheck finalize), verifies, commits
# as the bot and posts the `requirements/gate` commit status.
#
# Start it by adding the label `finalize` to a PR, or by commenting `/finalize`
# (OWNER/MEMBER/COLLABORATOR only). While the label is set it re-runs on every
# push and description edit. Pushes made with GITHUB_TOKEN do not trigger other
# workflows, so this job runs all checks itself.
on:
  pull_request:
    types: [labeled, synchronize, edited, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  statuses: write

concurrency:
  group: finalize-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  trigger:
    # Cheap pre-filter. Expressions cannot trim, so the exact `/finalize` match
    # is done in the step below.
    if: >-
      (github.event_name == 'pull_request'
        && github.event.pull_request.head.repo.full_name == github.repository
        && contains(github.event.pull_request.labels.*.name, 'finalize')
        && (github.event.action != 'labeled' || github.event.label.name == 'finalize'))
      ||
      (github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
        && startsWith(github.event.comment.body, '/finalize'))
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          EVENT: ${{ github.event_name }}
          COMMENT: ${{ github.event.comment.body }}
        run: |
          if [ "$EVENT" = issue_comment ]; then
            trimmed=$(printf '%s' "$COMMENT" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
            [ "$trimmed" = "/finalize" ] || { echo "run=false" >> "$GITHUB_OUTPUT"; exit 0; }
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"

  finalize:
    needs: trigger
    if: needs.trigger.outputs.run == 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
    steps:
      - name: Load the PR
        id: pr
        run: |
          # Always read the live PR: a comment event carries no PR data, and a
          # queued run must see the current description.
          gh api "repos/$GH_REPO/pulls/$PR_NUMBER" > "$RUNNER_TEMP/pr.json"
          {
            echo "head_ref=$(jq -r .head.ref "$RUNNER_TEMP/pr.json")"
            echo "head_sha=$(jq -r .head.sha "$RUNNER_TEMP/pr.json")"
            echo "base_ref=$(jq -r .base.ref "$RUNNER_TEMP/pr.json")"
            echo "url=$(jq -r .html_url "$RUNNER_TEMP/pr.json")"
            echo "same_repo=$(jq -r '.head.repo.full_name == .base.repo.full_name' "$RUNNER_TEMP/pr.json")"
            echo "state=$(jq -r .state "$RUNNER_TEMP/pr.json")"
          } >> "$GITHUB_OUTPUT"
          jq -r '.body // ""' "$RUNNER_TEMP/pr.json" > "$RUNNER_TEMP/pr-body.md"

      - name: Stop on closed or fork PRs
        if: steps.pr.outputs.same_repo != 'true' || steps.pr.outputs.state != 'open'
        run: |
          echo "::error::finalize only runs on open PRs from this repository"
          exit 1

      - name: Add the finalize label (comment trigger)
        if: github.event_name == 'issue_comment'
        run: gh pr edit "$PR_NUMBER" --add-label finalize

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt

      - name: Configure the bot identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge the base branch
        id: merge
        env:
          BASE_REF: ${{ steps.pr.outputs.base_ref }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          git fetch origin "$BASE_REF"
          # A comment may have queued behind a newer push: stay on the PR head.
          if [ "$(git rev-parse HEAD)" != "$HEAD_SHA" ]; then
            git reset --hard "$HEAD_SHA"
          fi
          git rev-parse HEAD > "$RUNNER_TEMP/start-sha"
          scripts/merge-base-branch.sh "origin/$BASE_REF" "$RUNNER_TEMP/unresolvable"

      - name: Report merge conflicts
        if: failure() && steps.merge.outcome == 'failure'
        env:
          BASE_REF: ${{ steps.pr.outputs.base_ref }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          {
            echo "Finalize could not merge \`$BASE_REF\` automatically. Resolve these paths by hand (merge \`$BASE_REF\` into the branch, fix, push), then re-run:"
            echo
            sed 's/^/- `/; s/$/`/' "$RUNNER_TEMP/unresolvable" 2>/dev/null || true
          } > "$RUNNER_TEMP/comment.md"
          gh pr comment "$PR_NUMBER" --body-file "$RUNNER_TEMP/comment.md"
          gh api "repos/$GH_REPO/statuses/$HEAD_SHA" -f state=failure \
            -f context="requirements/gate" -f description="Merge conflict: resolve by hand, then finalize again" \
            -f target_url="$GITHUB_SERVER_URL/$GH_REPO/actions/runs/$GITHUB_RUN_ID"

      - name: Finalize
        id: fin
        env:
          BASE_REF: ${{ steps.pr.outputs.base_ref }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          set -o pipefail
          python3 -m tools.reqcheck finalize --main "origin/$BASE_REF" \
            --pr-body "$RUNNER_TEMP/pr-body.md" --pr-url "$PR_URL" 2>&1 | tee "$RUNNER_TEMP/finalize.log"

      - name: Verify (tests, tree, gate)
        id: verify
        env:
          BASE_REF: ${{ steps.pr.outputs.base_ref }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          set -o pipefail
          {
            python3 -m pytest -q
            python3 -m tools.reqcheck tree
            python3 -m tools.reqcheck gate --main "origin/$BASE_REF" \
              --pr-body "$RUNNER_TEMP/pr-body.md" --pr-url "$PR_URL"
          } 2>&1 | tee "$RUNNER_TEMP/verify.log"

      - name: Commit and push
        id: push
        env:
          HEAD_REF: ${{ steps.pr.outputs.head_ref }}
        run: |
          git add -A requirements id-registry.yaml requirement-sets.yaml
          if ! git diff --cached --quiet; then
            git commit -m "Finalize requirements for merge"
          fi
          if [ "$(git rev-parse HEAD)" != "$(cat "$RUNNER_TEMP/start-sha")" ]; then
            git push origin "HEAD:refs/heads/$HEAD_REF"
          else
            echo "nothing to push"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Post requirements/gate success
        run: |
          gh api "repos/$GH_REPO/statuses/${{ steps.push.outputs.sha }}" -f state=success \
            -f context="requirements/gate" -f description="Requirements are finalized and valid" \
            -f target_url="$GITHUB_SERVER_URL/$GH_REPO/actions/runs/$GITHUB_RUN_ID"

      - name: Report failure
        if: failure() && steps.merge.outcome != 'failure'
        env:
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          {
            echo "Finalize failed. Fix the problem below, then push or comment \`/finalize\`."
            for f in finalize verify; do
              if [ -s "$RUNNER_TEMP/$f.log" ]; then
                echo; echo "**$f**"; echo '```'; tail -n 60 "$RUNNER_TEMP/$f.log"; echo '```'
              fi
            done
          } > "$RUNNER_TEMP/comment.md"
          gh pr comment "$PR_NUMBER" --body-file "$RUNNER_TEMP/comment.md" || true
          gh api "repos/$GH_REPO/statuses/$HEAD_SHA" -f state=failure \
            -f context="requirements/gate" -f description="Finalize failed: see the PR comment" \
            -f target_url="$GITHUB_SERVER_URL/$GH_REPO/actions/runs/$GITHUB_RUN_ID" || true
